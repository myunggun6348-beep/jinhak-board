<title>3학년 진학 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6; --surface-3:#E3E9F1;
  --ink:#151E2B; --ink-2:#4F5D6E; --ink-3:#8593A4;
  --line:#DCE3EC; --line-2:#C7D2E0;
  --accent:#2F4B7C; --accent-2:#41639C; --accent-soft:#E6EDF9;
  --ok:#136B49; --ok-soft:#DFF1E8;
  --warn:#8F5400; --warn-soft:#FBECD5;
  --bad:#A02A21; --bad-soft:#FAE5E2;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(21,30,43,.06), 0 6px 18px rgba(21,30,43,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#161D26; --surface-2:#1D2630; --surface-3:#26313D;
    --ink:#E8EDF3; --ink-2:#A8B4C2; --ink-3:#77838F;
    --line:#293341; --line-2:#364354;
    --accent:#93B2E9; --accent-2:#A9C3F1; --accent-soft:#1C2942;
    --ok:#62C695; --ok-soft:#12301F;
    --warn:#E0A24C; --warn-soft:#332614;
    --bad:#EB8880; --bad-soft:#331A18;
    --on-accent:#0E1620;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#161D26; --surface-2:#1D2630; --surface-3:#26313D;
  --ink:#E8EDF3; --ink-2:#A8B4C2; --ink-3:#77838F;
  --line:#293341; --line-2:#364354;
  --accent:#93B2E9; --accent-2:#A9C3F1; --accent-soft:#1C2942;
  --ok:#62C695; --ok-soft:#12301F;
  --warn:#E0A24C; --warn-soft:#332614;
  --bad:#EB8880; --bad-soft:#331A18;
  --on-accent:#0E1620;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}

/* ── shell ─────────────────────────────────── */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding-block:10px; padding-inline:16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand h1{font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em}
.brand .yr{font-size:11px; color:var(--ink-3); letter-spacing:.06em}
.tabs{display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:8px}
.tabs button{
  border:0; background:transparent; color:var(--ink-2);
  padding:6px 13px; border-radius:6px; font-size:13px; font-weight:500;
}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:700}
.sync{font-size:11.5px; color:var(--ink-3); display:flex; align-items:center; gap:5px; min-width:0}
.sync span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--ok)}
.dot.off{background:var(--warn)}

.wrap{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:18px 64px}

/* ── class picker ──────────────────────────── */
.classbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.classbar .lab{font-size:12px; color:var(--ink-3); letter-spacing:.04em; margin-right:2px}
.chip{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  padding:6px 14px; border-radius:999px; font-size:13px; font-weight:500;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}

/* ── alert strip ───────────────────────────── */
.alerts{display:flex; flex-direction:column; gap:7px; margin-bottom:18px}
.alert{
  display:flex; gap:10px; align-items:flex-start;
  border:1px solid var(--line); border-left:3px solid var(--warn);
  background:var(--warn-soft); border-radius:var(--radius);
  padding:10px 13px; font-size:13px;
}
.alert.crit{border-left-color:var(--bad); background:var(--bad-soft)}
.alert b{font-weight:700}
.alert .who{font-weight:700; white-space:nowrap}
.alert .msg{color:var(--ink-2)}
.alert .msg strong{color:var(--ink); font-weight:700}

/* ── stats ─────────────────────────────────── */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; margin-bottom:18px}
.stat{background:var(--surface); padding:12px 14px}
.stat .n{font-size:22px; font-weight:700; letter-spacing:-.02em; display:block; line-height:1.2}
.stat .k{font-size:11.5px; color:var(--ink-3); letter-spacing:.03em}
.stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)}

/* ── student list ──────────────────────────── */
.listhead{display:flex; align-items:baseline; gap:10px; margin:0 0 9px; padding-inline:2px}
.listhead h2{font-size:14px; font-weight:700; margin:0}
.listhead .cnt{font-size:12px; color:var(--ink-3)}
.listhead .sp{margin-left:auto; display:flex; gap:6px}
.ghost{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  padding:5px 11px; border-radius:7px; font-size:12.5px; font-weight:500}
.ghost:hover{background:var(--surface-2); color:var(--ink)}

.rows{display:flex; flex-direction:column; gap:6px}
.row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.row.flag{border-color:var(--bad); }
.rowhead{display:flex; align-items:center; gap:12px; padding:10px 13px; width:100%;
  background:transparent; border:0; text-align:left}
.rowhead .no{font-size:12.5px; color:var(--ink-3); width:52px; flex:none}
.rowhead .nm{font-weight:700; width:78px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pills{display:flex; gap:5px; flex-wrap:wrap; flex:1; min-width:0}
.pill{font-size:11.5px; padding:2.5px 8px; border-radius:999px; border:1px solid var(--line-2);
  background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.pill.s-ok{background:var(--ok-soft); border-color:transparent; color:var(--ok); font-weight:700}
.pill.s-wait{background:var(--warn-soft); border-color:transparent; color:var(--warn); font-weight:700}
.pill.s-bad{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.pill.s-go{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
.pill.empty{color:var(--ink-3); border-style:dashed; background:transparent}
.flagmark{font-size:11px; font-weight:700; color:var(--bad); background:var(--bad-soft);
  padding:2.5px 8px; border-radius:999px; white-space:nowrap}
.caret{color:var(--ink-3); font-size:11px; flex:none}

/* ── detail ────────────────────────────────── */
.detail{border-top:1px solid var(--line); padding:13px; display:flex; flex-direction:column; gap:10px}
.app{border:1px solid var(--line); border-radius:9px; background:var(--surface-2); padding:11px}
.app.warn{border-color:var(--warn)}
.grid{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.f{display:flex; flex-direction:column; gap:3px; min-width:0}
.f label{font-size:11px; color:var(--ink-3); letter-spacing:.03em}
.f input,.f select{
  border:1px solid var(--line-2); background:var(--surface); border-radius:6px;
  padding:6px 8px; font-size:13px; width:100%; min-width:0;
}
.f input:disabled,.f select:disabled{background:var(--surface-3); color:var(--ink-3)}
.apphead{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.apphead .kind{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--accent);
  background:var(--accent-soft); padding:2px 8px; border-radius:5px}
.minnote{margin-top:8px; font-size:12px; color:var(--ink-3)}
.minnote.off{color:var(--warn); font-weight:700}
.apphead .warnnote{font-size:11.5px; color:var(--bad); font-weight:700; margin-left:auto}
.del{border:0; background:transparent; color:var(--ink-3); font-size:12px; padding:3px 6px; border-radius:5px}
.del:hover{color:var(--bad); background:var(--bad-soft)}
.addrow{display:flex; gap:7px; flex-wrap:wrap}
.btn{border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); padding:7px 14px;
  border-radius:7px; font-size:13px; font-weight:600}
.btn.sec{background:transparent; color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ── add / paste ───────────────────────────── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px; box-shadow:var(--shadow); margin-top:14px}
.panel h3{margin:0 0 9px; font-size:13px; font-weight:700}
.panel p.hint{margin:0 0 9px; font-size:12px; color:var(--ink-3)}
textarea{width:100%; border:1px solid var(--line-2); background:var(--surface); border-radius:7px;
  padding:9px; font-size:13px; min-height:88px; resize:vertical; font-family:inherit}
.inline{display:flex; gap:7px; flex-wrap:wrap; align-items:flex-end}
.inline .f{flex:0 1 130px}

.subtabs{display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:8px; margin-bottom:12px; width:fit-content; max-width:100%; flex-wrap:wrap}
.subtabs button{border:0; background:transparent; color:var(--ink-2); padding:6px 13px; border-radius:6px; font-size:12.5px; font-weight:500}
.subtabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow)}
.drop{border:1.5px dashed var(--line-2); border-radius:var(--radius); background:var(--surface-2);
  padding:24px 16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:9px}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop b{font-weight:700; color:var(--ink)}
.drop .hint{font-size:12px; color:var(--ink-3); max-width:44ch}
.fmts{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:2px}
.fmt{font-size:11px; padding:2px 8px; border-radius:5px; background:var(--surface); border:1px solid var(--line-2); color:var(--ink-2)}
.fmt.no{color:var(--ink-3); text-decoration:line-through}
.pv{margin-top:14px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.pvhead{display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--surface-2); flex-wrap:wrap}
.pvhead .t{font-weight:700; font-size:13px}
.pvhead .s{font-size:12px; color:var(--ink-3)}
.pvhead .acts{margin-left:auto; display:flex; gap:6px}
.pvbody{max-height:260px; overflow:auto}
.pvbody table{min-width:0}
.badge{font-size:10.5px; padding:1.5px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-weight:700}
.badge.up{background:var(--warn-soft); color:var(--warn)}
.skip{padding:10px 13px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line); background:var(--surface)}
.err{border-left:3px solid var(--bad); background:var(--bad-soft); border-radius:var(--radius);
  padding:11px 13px; font-size:13px; margin-top:12px}
.err b{display:block; margin-bottom:3px}
.tmpl{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:11px;
  padding-top:11px; border-top:1px solid var(--line)}
.tmpl .tl{font-size:12px; color:var(--ink-3)}
.tmpl .tn{font-size:11.5px; color:var(--ink-3); flex-basis:100%}
.miss{color:var(--bad); font-weight:700}
.note{padding:9px 13px; font-size:12px; color:var(--warn); background:var(--warn-soft); border-top:1px solid var(--line)}
.err .how{color:var(--ink-2); font-size:12.5px}

/* ── overview table ────────────────────────── */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:640px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:11.5px; color:var(--ink-3); font-weight:500; letter-spacing:.04em;
  background:var(--surface-2); position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.banner{border:1px dashed var(--line-2); background:var(--surface-2); border-radius:var(--radius);
  padding:13px; margin-bottom:16px; font-size:13px; color:var(--ink-2)}
.banner b{color:var(--ink)}
.empty-state{text-align:center; padding:40px 16px; color:var(--ink-3)}
@media (max-width:560px){
  .rowhead .nm{width:62px}
  .rowhead .no{width:46px}
  .wrap{padding-block:14px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="topbar">
  <div class="brand">
    <h1>3학년 진학 현황판</h1>

  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabClass" aria-selected="true">우리 반</button>
    <button role="tab" id="tabAll" aria-selected="false">전체 현황</button>
  </div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">연결 중</span></div>
</div>

<div class="wrap">
  <div id="banner" class="banner" hidden></div>

  <div id="viewClass">
    <div class="classbar" id="classbar"></div>
    <div class="alerts" id="alerts"></div>
    <div class="stats" id="stats"></div>

    <div class="listhead">
      <h2 id="listTitle">학생</h2>
      <span class="cnt" id="listCount"></span>
      <span class="sp">
        <button class="ghost" id="btnCsv">CSV 내려받기</button>
      </span>
    </div>
    <div class="rows" id="rows"></div>

    <div class="panel" id="addPanel">
      <h3>학생 명단 넣기</h3>
      <div class="subtabs" role="tablist">
        <button role="tab" id="stFile" aria-selected="true">파일에서</button>
        <button role="tab" id="stPaste" aria-selected="false">붙여넣기</button>
        <button role="tab" id="stOne" aria-selected="false">한 명씩</button>
      </div>

      <div id="paneFile">
        <div class="drop" id="drop">
          <b>학번과 이름이 든 파일을 여기에 끌어다 놓으세요</b>
          <button class="btn sec" id="btnPick">파일 선택</button>
          <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.hwpx,.hwp" hidden>
          <span class="hint">명단이든 지원 현황이든, 앱이 어느 쪽인지 알아서 가려냅니다. 넣기 전에 읽은 결과를 먼저 보여드립니다.</span>
          <span class="fmts" id="fmts"></span>
        </div>
      </div>

      <div id="panePaste" hidden>
        <p class="hint">한 줄에 한 명. 학번과 이름 사이는 띄어쓰기, 탭, 쉼표 무엇이든 됩니다. 한글 표를 복사해 붙여넣어도 읽습니다.</p>
        <textarea id="bulk" placeholder="30201 김민수&#10;30202 이서연&#10;30203 박지훈"></textarea>
        <div style="margin-top:8px"><button class="btn" id="btnBulk">읽어 보기</button></div>
      </div>

      <div id="paneOne" hidden>
        <div class="inline">
          <div class="f"><label for="newNo">학번</label><input id="newNo" class="mono" inputmode="numeric" placeholder="30215"></div>
          <div class="f"><label for="newName">이름</label><input id="newName" placeholder="홍길동"></div>
          <button class="btn" id="btnAdd">추가</button>
        </div>
      </div>

      <div class="tmpl">
        <span class="tl">서식이 필요하시면</span>
        <button class="ghost" id="btnTmplRoster">명단 서식</button>
        <button class="ghost" id="btnTmplApps">지원 현황 서식</button>
        <span class="tn">지원 현황은 상태·전형 값이 정해져 있어 서식을 쓰시는 편이 안전합니다.</span>
      </div>
      <div id="importMsg"></div>
      <div id="preview" class="pv" hidden></div>
    </div>
  </div>

  <div id="viewAll" hidden>
    <div class="alerts" id="allAlerts"></div>
    <div class="stats" id="allStats"></div>
    <div class="listhead"><h2>반별 현황</h2><span class="sp"><button class="ghost" id="btnCsvAll">전체 CSV 내려받기</button></span></div>
    <div class="tablewrap"><table id="classTable"></table></div>
    <div class="listhead" style="margin-top:22px"><h2>대학별 지원 수</h2></div>
    <div class="tablewrap"><table id="univTable"></table></div>
  </div>
</div>

/* ── helpers ───────────────────────────────── */
function el(t,c,txt){var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}
function uid(){return "x"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?"":s);}
function getCls(){try{var v=localStorage.getItem("jh.cls"); return v?parseInt(v,10):null;}catch(e){return null;}}
function setCls(v){try{localStorage.setItem("jh.cls",String(v));}catch(e){}}
function daysTo(s){ if(!s) return null; var d=new Date(s); if(isNaN(d)) return null;
  var t=new Date(); t.setHours(0,0,0,0); var x=new Date(d); x.setHours(0,0,0,0);
  return Math.round((x-t)/86400000); }
function fmtDue(s){ if(!s) return ""; var d=new Date(s); if(isNaN(d)) return s;
  var p=function(n){return n<10?"0"+n:""+n;};
  return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function statusClass(s){
  if(PASS[s]) return "s-ok";
  if(s==="충원대기") return "s-wait";
  if(s==="불합격"||s==="1단계불"||s==="등록포기") return "s-bad";
  return "s-go";
}

/* ── the five checks ───────────────────────── */
function checkStudent(st){
  var out=[], apps=st.apps||[];
  var six=0, passed=0, reg=0, jungsi=0, itv={};
  apps.forEach(function(a){
    if(a.kind==="수시"&&a.c6) six++;
    if(a.kind==="수시"&&PASS[a.status]) passed++;
    if(a.status==="등록완료") reg++;
    if(a.kind==="정시") jungsi++;
    if(a.itv){ itv[a.itv]=(itv[a.itv]||0)+1; }
  });
  if(six>6) out.push({lv:"crit",code:"6장초과",msg:"수시 지원이 "+six+"건입니다. 6장 제한을 넘었습니다."});
  Object.keys(itv).forEach(function(d){ if(itv[d]>1)
    out.push({lv:"warn",code:"면접중복",msg:d+" 면접이 "+itv[d]+"건 겹칩니다."}); });
  if(passed>0&&jungsi>0) out.push({lv:"crit",code:"정시지원불가",msg:"수시에 합격했습니다. 등록을 포기해도 정시 지원이 불가합니다."});
  if(reg>1) out.push({lv:"crit",code:"이중등록",msg:"등록완료가 "+reg+"건입니다. 이중등록은 입학 취소 사유입니다."});
  apps.forEach(function(a){
    if(a.kind==="수시"&&a.mmet==="미충족"&&LIVE[a.status])
      out.push({lv:"warn",code:"최저 미충족",
        msg:(a.univ||"한 곳")+" 수능최저를 채우지 못했습니다"+(a.mreq?"("+a.mreq+")":"")+". 사실상 탈락이니 정시 준비로 돌려야 합니다."});
    if(a.ann&&AWAIT[a.status]&&daysTo(a.ann)<0)
      out.push({lv:"warn",code:"결과 미입력",msg:(a.univ||"한 곳")+" 발표일("+a.ann+")이 지났는데 상태가 ‘"+a.status+"’ 그대로입니다. 학생에게 결과를 확인해 주세요."});
    if(a.status==="충원대기"&&a.due){
      var d=daysTo(a.due);
      if(d!==null&&d>=0&&d<=3)
        out.push({lv:"crit",code:"충원마감",msg:a.univ+" 충원 마감이 "+(d===0?"오늘":d+"일 뒤")+"입니다("+fmtDue(a.due)+"). 전화를 받을 수 있어야 합니다."});
    }
  });
  return out;
}
function appWarn(st,a){
  var apps=st.apps||[];
  if(a.kind==="수시"&&a.mmet==="미충족"&&LIVE[a.status]) return "수능최저 미충족";
  if(a.kind==="정시"&&apps.some(function(x){return x.kind==="수시"&&PASS[x.status];})) return "수시 합격자는 정시 지원 불가";
  if(a.itv&&apps.filter(function(x){return x.itv===a.itv;}).length>1) return "면접일 중복";
  if(a.status==="등록완료"&&apps.filter(function(x){return x.status==="등록완료";}).length>1) return "이중등록";
  if(a.status==="충원대기"&&a.due){var d=daysTo(a.due); if(d!==null&&d>=0&&d<=3) return "충원 마감 임박";}
  if(a.ann&&AWAIT[a.status]&&daysTo(a.ann)<0) return "결과 미입력";
  return "";
}

/* ── 수능최저 자동 판정 ─────────────────────
   기준 문장을 읽어 조건 목록으로 바꾼다. 알아보지 못한 부분이 조금이라도 남으면 판정하지 않는다.
   탐구 반영 방식(상위 1과목 / 2과목 평균 / 평균 절사)이 적혀 있지 않으면 셋 다 계산해
   결과가 모두 같을 때만 판정한다. 틀린 판정은 판정 없음보다 위험하다. */
var CSAT=[["kor","국어"],["math","수학"],["eng","영어"],["inq1","탐구1"],["inq2","탐구2"],["his","한국사"]];
var CSATKEY={"국":"kor","수":"math","영":"eng","한":"his"};
var CSATNAME={"국":"국어","수":"수학","영":"영어","탐":"탐구","한":"한국사"};
function parseMin(raw){
  var s=String(raw||"").replace(/\s+/g,"");
  if(!s) return {err:"기준이 비어 있습니다"};
  if(/^(없음|해당없음|미적용|최저없음|무|-|—|x|X)$/.test(s)) return {none:true};
  if(/(미적|기하|확통|확률|과탐|사탐|직탐|제2외|외국어|한문|또는|혹은)/.test(s))
    return {err:"선택과목·대체 조건이 있어 직접 확인해야 합니다"};
  s=s.replace(/(수능최저학력기준|수능최저기준|수능최저|최저학력기준|최저기준|최저|등급|이내|영역|반영|적용|:)/g,"")
     .replace(/국어/g,"국").replace(/수학/g,"수").replace(/영어/g,"영").replace(/탐구/g,"탐").replace(/한국사/g,"한");
  var top=/1과목|\(1\)/.test(s), avg=/2과목|\(2\)|평균/.test(s), cut=/절사|버림/.test(s);
  if(top&&avg) return {err:"탐구 반영 방식이 두 가지로 적혀 있습니다"};
  var modes=top?["top"]:avg?(cut?["floor"]:["avg","floor"]):["top","avg","floor"];
  s=s.replace(/\([12]\)|(상위)?[12]과목|평균|소수점?(이하)?(절사|버림)|절사|버림/g,"")
     .replace(/([국수영탐한])[,·\/]+(?=[국수영탐한])/g,"$1");
  var must=null;
  s=s.replace(/\(?([국수영탐])(?:필수)?포함\)?|\(?([국수영탐])필수\)?/g,function(_,a,b){must=a||b; return ",";});
  var conds=[];
  s=s.replace(/([국수영탐]+)?중?(\d)개?(합|각)(\d{1,2})/g,function(_,set,n,op,m){
    conds.push({set:set||"국수영탐",n:+n,op:op,m:+m}); return ",";});
  s=s.replace(/([국수영탐]{2,})각(\d)/g,function(_,set,m){ conds.push({set:set,n:set.length,op:"각",m:+m}); return ",";});
  s=s.replace(/([국수영탐한])(\d)(?![\d개합각])/g,function(_,a,m){ conds.push({set:a,n:1,op:"각",m:+m}); return ",";});
  var rest=s.replace(/[,+\/·&()\[\]、.]|및|중|이고|그리고|탐/g,"");
  if(rest) return {err:"알아보지 못한 표현이 있습니다. 예: 국수영탐 중 2개합 5, 한국사 4"};
  if(!conds.length) return {err:"조건을 찾지 못했습니다"};
  for(var i=0;i<conds.length;i++){
    var c=conds[i]; c.set=c.set.split("").filter(function(x,j,arr){return arr.indexOf(x)===j;}).join("");
    if(must&&c.n>1){ if(c.set.indexOf(must)<0) return {err:"포함 과목이 영역 목록에 없습니다"}; c.must=must; }
    if(c.n>c.set.length) return {err:c.set+" 중 "+c.n+"개는 고를 수 없습니다"};
  }
  return {conds:conds, modes:modes};
}
function minEval(conds,g,mode){
  var miss=null;
  function gv(a){
    if(a==="탐"){
      var x=+g.inq1||0, y=+g.inq2||0;
      if(mode==="top") return (x||y)?Math.min(x||9,y||9):0;
      if(!x||!y) return 0;
      return mode==="floor"?Math.floor((x+y)/2):(x+y)/2;
    }
    return +g[CSATKEY[a]]||0;
  }
  var ok=true, why=[];
  conds.forEach(function(c){
    var vals=c.set.split("").map(function(a){ var v=gv(a); if(!v) miss=miss||CSATNAME[a]; return {a:a,v:v}; });
    if(miss) return;
    var pick=c.must?vals.filter(function(x){return x.a===c.must;}):[];
    pick=pick.concat(vals.filter(function(x){return x.a!==c.must;}).sort(function(p,q){return p.v-q.v;}).slice(0,c.n-pick.length));
    var nums=pick.map(function(x){return x.v;});
    var got=c.op==="합"?nums.reduce(function(p,q){return p+q;},0):Math.max.apply(null,nums);
    if(got>c.m) ok=false;
    why.push((c.n===1?CSATNAME[pick[0].a]:c.n+"개"+c.op)+" "+got+(got>c.m?" > ":" ≤ ")+c.m);
  });
  return {ok:ok, why:why.join(", "), miss:miss};
}
function judgeMin(raw,g){
  var p=parseMin(raw);
  if(p.none) return {res:"해당없음", why:"수능최저 없음"};
  if(p.err) return {res:null, why:p.err};
  var outs=p.modes.map(function(m){ return minEval(p.conds,g||{},m); });
  if(outs[0].miss) return {res:null, why:outs[0].miss+" 등급이 없습니다"};
  if(outs.some(function(o){return o.ok!==outs[0].ok;}))
    return {res:null, why:"탐구 반영 방식(1과목·2과목 평균)에 따라 결과가 갈립니다. 요강을 보고 기준에 적어 주세요"};
  return {res:outs[0].ok?"충족":"미충족", why:outs[0].why};
}
function hasCsat(st){ return CSAT.some(function(k){ return st.csat&&st.csat[k[0]]; }); }
/* 등급이나 기준을 고쳤을 때만 부른다. 그 뒤 담임이 직접 고른 값은 다음 수정 때까지 그대로 둔다. */
function applyMin(st){
  (st.apps||[]).forEach(function(a){
    if(a.kind!=="수시") return;
    var r=judgeMin(a.mreq, st.csat);
    if(r.res) a.mmet=r.res;
  });
}

function list(){ return demo ? DEMO.slice() : Array.from(students.values()); }
function sorted(arr){ return arr.sort(function(a,b){ return String(a.no).localeCompare(String(b.no)); }); }
function byClass(c){ return sorted(list().filter(function(s){return s.cls===c;})); }

function save(st){
  st.updatedAt=new Date().toISOString();
  students.set(st.id, st);
  if(demo||!db||canWrite===false) return;
  var k=st.id;
  if(writeTimers.has(k)) clearTimeout(writeTimers.get(k));
  writeTimers.set(k, setTimeout(function(){
    writeTimers.delete(k);
    db.doc("students/"+k).set(JSON.parse(JSON.stringify(st))).catch(function(e){
      setSync("off","저장 실패 — "+(e&&e.code==="invalid_argument"?"입력 권한이 없습니다":"다시 시도해 주세요"));
    });
  },500));
}
function setSync(kind,text){

/* ── render: class view ────────────────────── */
function render(){
  if(pendingRender) return;
  var cls=getCls();
  renderClassbar(cls);
  var mine = cls?byClass(cls):[];
  document.getElementById("listTitle").textContent = cls? (cls+"반 학생") : "반을 선택하세요";
  document.getElementById("listCount").textContent = cls? (mine.length+"명") : "";
  document.getElementById("addPanel").hidden = !cls || canWrite===false;
  renderAlerts(document.getElementById("alerts"), mine, false);
  renderStats(document.getElementById("stats"), mine);
  renderRows(mine, cls);
  if(!document.getElementById("viewAll").hidden) renderAll();
}
function renderClassbar(cls){
  var bar=document.getElementById("classbar");
  if(bar.childElementCount) {
    Array.prototype.forEach.call(bar.querySelectorAll(".chip"),function(b){
      b.setAttribute("aria-pressed", String(parseInt(b.dataset.c,10)===cls));
    });

  CLASSES.forEach(function(c){

}
function renderStats(host, arr){
  var n=arr.length, pass=0, wait=0, live=0, flags=0, js=0, minx=0;
  arr.forEach(function(s){
    var apps=s.apps||[];
    if(apps.some(function(a){return a.kind==="수시"&&a.mmet==="미충족";})) minx++;
    if(apps.some(function(a){return a.kind==="수시"&&PASS[a.status];})) pass++;
    else if(apps.some(function(a){return a.status==="충원대기";})) wait++;
    else if(apps.some(function(a){return LIVE[a.status];})) live++;
    if(apps.some(function(a){return a.kind==="정시";})) js++;
    if(checkStudent(s).length) flags++;
  });
  host.innerHTML="";
  [["학생",n,""],["수시 합격",pass,"ok"],["충원 대기",wait,"warn"],["진행 중",live,""],
   ["최저 미충족",minx,minx?"warn":""],["정시 지원",js,""],["점검 경고",flags,flags?"bad":""]]

function renderRows(arr, cls){
  var host=document.getElementById("rows");

function detail(st){

function csv(arr,name){
  var head=["반","학번","이름","구분","대학","모집단위","전형명","전형유형","군","6장포함","면접일","발표일","충원마감","상태","수능최저기준","최저충족","예비번호","메모","점검"];
  var lines=[head.join(",")];
  var q=function(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  arr.forEach(function(s){
    var w=checkStudent(s).map(function(x){return x.code;}).join(" ");

    apps.forEach(function(a){
      lines.push([s.cls,s.no,s.name,a.kind||"",a.univ||"",a.major||"",a.jh||"",a.type||"",a.group||"",
        a.c6?"Y":"N",a.itv||"",a.ann||"",a.due||"",a.status||"",a.mreq||"",a.mmet||"",a.rank||"",a.note||"",w].map(q).join(","));
    });
  });
  var data="﻿"+lines.join("\r\n");
  if(!downloadsCap){ alert("이 화면에서는 내려받기를 쓸 수 없습니다."); return; }
  downloadsCap.save({filename:name, data:data}).catch(function(e){

    alert("내려받지 못했습니다. 잠시 후 다시 시도해 주세요.");
  });
}

/* ══ 명단 불러오기 ══════════════════════════════
   CSV / TXT / 엑셀 / 한글(.hwpx) 에서 학번·이름을 찾아낸다.
   열 순서는 고정하지 않고 칸의 생김새로 판별한다. */
var HEADWORD=/^(학번|번호|연번|순번|성명|이름|학생|학년|반|비고|구분|계열|담임|No\.?)$/;
var pending=null;

function decodeText(buf){
  var u8=new Uint8Array(buf);
  if(u8.length>2&&u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF) u8=u8.subarray(3);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u8); }
  catch(e){
    try{ return new TextDecoder("euc-kr").decode(u8); }
    catch(e2){ return new TextDecoder("utf-8").decode(u8); }
  }
}
function parseDelimited(text){
  var rows=[], row=[], cur="", q=false, i=0, delim=null;
  var first=text.split(/\r?\n/)[0]||"";
  if(first.indexOf("\t")>-1) delim="\t";
  else if(first.indexOf(",")>-1) delim=",";
  else delim=null;
  if(delim===null){
    text.split(/\r?\n/).forEach(function(l){ if(l.trim()) rows.push(l.trim().split(/\s{1,}/)); });
    return rows;
  }
  for(;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c==="\r"){ }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim();}); });
}
function rowsFromHwpx(zip){
  var names=Object.keys(zip.files).filter(function(n){ return /Contents\/section\d+\.xml$/i.test(n); });
  if(!names.length) names=Object.keys(zip.files).filter(function(n){ return /\.xml$/i.test(n)&&/section/i.test(n); });
  if(!names.length) return Promise.reject({code:"nosection"});
  names.sort();
  return Promise.all(names.map(function(n){ return zip.files[n].async("string"); })).then(function(xmls){
    var rows=[];
    xmls.forEach(function(xml){
      var doc=new DOMParser().parseFromString(xml,"application/xml");
      if(doc.getElementsByTagName("parsererror").length) return;
      var all=doc.getElementsByTagName("*"), trs=[], ps=[];
      for(var i=0;i<all.length;i++){
        var ln=all[i].localName;
        if(ln==="tr") trs.push(all[i]);
        else if(ln==="p") ps.push(all[i]);
      }
      if(trs.length){
        trs.forEach(function(tr){
          var kids=tr.getElementsByTagName("*"), cells=[];
          for(var j=0;j<kids.length;j++){
            if(kids[j].localName==="tc") cells.push((kids[j].textContent||"").replace(/\s+/g," ").trim());
          }
          if(cells.length) rows.push(cells);
        });
      } else {
        ps.forEach(function(pn){
          var t=(pn.textContent||"").replace(/\s+/g," ").trim();
          if(t) rows.push(t.split(/[\s,\t]+/));
        });
      }
    });
    return rows;
  });
}
function pickStudents(rows, cls){
  var out=[], skipped=[];
  rows.forEach(function(cells){
    var vals=cells.map(function(c){ return String(c==null?"":c).replace(/\s+/g," ").trim(); }).filter(function(v){return v;});
    if(!vals.length) return;
    var no=null, name=null, smalls=[];
    vals.forEach(function(v){
      if(HEADWORD.test(v)) return;
      if(!no && /^\d{5,6}$/.test(v)) { no=v; return; }
      if(!name && /^[가-힣]{2,6}$/.test(v)) { name=v; return; }
      if(/^\d{1,2}$/.test(v)) smalls.push(v);
    });
    if(!name){
      for(var i=0;i<vals.length;i++){
        if(HEADWORD.test(vals[i])) continue;
        if(/^[A-Za-z][A-Za-z .'-]{1,20}$/.test(vals[i])){ name=vals[i]; break; }
      }
    }
    if(!name){ skipped.push(vals.join(" ")); return; }
    var made=false;
    if(!no && smalls.length){
      var n=smalls[smalls.length-1];
      var cc=String(cls); if(cc.length<2) cc="0"+cc;
      no="3"+cc+(n.length<2?"0"+n:n);
      made=true;
    }
    if(!no){ skipped.push(vals.join(" ")); return; }
    out.push({no:no, name:name, made:made});
  });
  var seen={}, uniq=[];
  out.forEach(function(o){ if(seen[o.no]) return; seen[o.no]=1; uniq.push(o); });
  return {list:uniq, skipped:skipped};
}

/* ══ 지원 현황 가져오기 ════════════════════════
   열 이름으로 항목을 맞추고, 값은 흔히 쓰는 표현까지 받아준다.
   못 알아본 값은 지어내지 않고 미리보기에서 빨갛게 표시한다. */
var COLMAP=[
  ["no",      /^(학번|학생번호|학적번호)$/],
  ["name",    /^(이름|성명|학생명|학생)$/],
  ["kind",    /^(구분|전형구분|수시정시|수시\/정시)$/],
  ["univ",    /^(대학|대학명|지원대학|학교|학교명)$/],
  ["major",   /^(모집단위|학과|전공|학부|모집단위명)$/],
  ["jh",      /^(전형명|전형)$/],
  ["type",    /^(전형유형|유형)$/],
  ["group",   /^(군|모집군|분할모집군)$/],
  ["c6",      /^(6장포함|6장|제한포함|6장제한)$/],

  ["ann",     /^(발표일|발표일자|발표|합격자발표|합격자발표일|결과발표|결과발표일)$/],
  ["due",     /^(충원마감|충원마감일|충원|예비마감|충원기간)$/],
  ["status",  /^(상태|결과|합불|진행상태|합격여부)$/],
  ["mreq",    /^(수능최저기준|수능최저|최저기준|최저학력기준|최저)$/],
  ["mmet",    /^(최저충족|최저충족여부|충족여부|충족|최저달성)$/],
  ["rank",    /^(예비번호|예비|충원순위|순위)$/],
  ["note",    /^(메모|비고|특이사항)$/]
];
var STATUSMAP=[
  /* 순서가 중요하다. '불합격'은 '합격'을 품고 '1단계 불합격'은 '불합격'을 품으므로
     좁은 뜻부터, 부정 표현을 긍정 표현보다 먼저 본다. */
  [/(등록포기|포기)/,"등록포기"],
  [/^(등록완료|등록|등록함)$/,"등록완료"],
  [/(1단계|서류|1차).*(불합|불합격|탈락|미선발|불)/,"1단계불"],
  [/(1단계|서류|1차).*(합격|합|통과|선발)/,"1단계합"],
  [/(추합|추가합격|충원합격|충원합|예비합격|예비합)/,"충원합"],
  [/(충원대기|예비대기|예비번호|예비|대기)/,"충원대기"],
  [/(면접완료|면접응시|면접함|면접봄)/,"면접완료"],
  [/(불합격|불합|탈락|미합격|부적격|미선발|드랍|낙방)/,"불합격"],
  [/(최초합격|최초합|합격|합)/,"최초합"],
  [/(지원완료|지원|접수|원서)/,"지원완료"]
];
var MINMAP=[
  [/(해당없음|해당\s*없|없음|무관|미적용)/,"해당없음"],
  [/(미충족|불충족|못채움|미달|부족|^x$|^n$|아니오)/i,"미충족"],
  [/(충족|만족|달성|통과|^o$|^y$|^예$)/i,"충족"],
  [/(미정|미확인|모름|대기)/,"미정"]
];
function mapMin(v){
  var t=norm(v); if(!t) return null;
  for(var i=0;i<MINMAP.length;i++) if(MINMAP[i][0].test(t)) return MINMAP[i][1];
  return null;
}
var TYPEMAP=[[/(학종|종합)/,"학종"],[/(교과)/,"교과"],[/(논술)/,"논술"],[/(실기|특기)/,"실기"],[/(정시|수능)/,"정시"]];
function norm(v){ return String(v==null?"":v).replace(/\s+/g,"").trim(); }
function mapStatus(v){
  var t=norm(v); if(!t) return null;
  for(var i=0;i<STATUSMAP.length;i++) if(STATUSMAP[i][0].test(t)) return STATUSMAP[i][1];
  return null;
}
function mapType(v){
  var t=norm(v); if(!t) return null;
  for(var i=0;i<TYPEMAP.length;i++) if(TYPEMAP[i][0].test(t)) return TYPEMAP[i][1];
  return null;
}
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function parseDate(v, withTime){
  if(v instanceof Date && !isNaN(v)){
    var iso=v.getFullYear()+"-"+pad2(v.getMonth()+1)+"-"+pad2(v.getDate());
    return withTime? iso+"T"+pad2(v.getHours())+":"+pad2(v.getMinutes()) : iso;
  }
  var t=String(v==null?"":v).trim(); if(!t) return "";
  var time="", m;
  var datePart=t, hasTime=false;
  var tmatch=t.match(/(\d{1,2}):(\d{2})/);
  if(tmatch){ time="T"+pad2(tmatch[1])+":"+tmatch[2]; hasTime=true; datePart=t.slice(0,tmatch.index); }
  var y,mo,d;
  if((m=datePart.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))){ y=m[1];mo=m[2];d=m[3]; }
  else if((m=datePart.match(/^(\d{4})(\d{2})(\d{2})$/))){ y=m[1];mo=m[2];d=m[3]; }
  else if((m=datePart.match(/(\d{1,2})\s*[-./월]\s*(\d{1,2})/))){
    mo=m[1]; d=m[2]; y=(parseInt(mo,10)>=9)? (YEAR-1) : YEAR;
  } else return "";
  var iso2=y+"-"+pad2(mo)+"-"+pad2(d);
  if(!withTime) return iso2;
  return iso2+(hasTime?time:"T00:00");
}
function parseYN(v){
  var t=norm(v);
  if(!t) return null;
  if(/^(y|yes|o|예|포함|true|1|v)$/i.test(t)) return true;
  if(/^(n|no|x|아니오|아님|제외|false|0)$/i.test(t)) return false;
  return null;
}
function headerIndex(rows){
  for(var r=0;r<Math.min(rows.length,8);r++){
    var cells=(rows[r]||[]).map(norm), map={}, hits=0;
    cells.forEach(function(c,i){
      if(!c) return;
      COLMAP.forEach(function(pair){
        if(map[pair[0]]===undefined && pair[1].test(c)){ map[pair[0]]=i; hits++; }
      });
    });
    if(map.univ!==undefined && (map.name!==undefined||map.no!==undefined)) return {row:r, map:map, hits:hits};
  }
  return null;
}
function importApps(rows, cls, hdr){
  var m=hdr.map, out=[], skipped=[], notes={status:0, due:0};
  for(var r=hdr.row+1;r<rows.length;r++){
    var c=rows[r]||[];
    var get=function(k){ return m[k]===undefined?"":c[m[k]]; };
    var name=String(get("name")||"").trim();
    var no=String(get("no")||"").trim();
    var univ=String(get("univ")||"").trim();
    if(/예시/.test(name)||/예시/.test(univ)) continue;
    if(!univ && !name){ continue; }
    if(!univ){ skipped.push((no||"")+" "+name+" — 대학이 비어 있음"); continue; }
    if(!no && !name){ skipped.push("학생을 알 수 없는 줄"); continue; }
    var kindRaw=norm(get("kind"));
    var kind=/정시/.test(kindRaw)?"정시":(kindRaw?"수시":(norm(get("group"))?"정시":"수시"));
    var st=mapStatus(get("status"));
    if(get("status")&&!st) notes.status++;
    var due=parseDate(get("due"),true);
    if(due&&/T00:00$/.test(due)) notes.due++;
    var yn=parseYN(get("c6"));
    out.push({
      no:no, name:name,
      app:{id:uid(), kind:kind, univ:univ,
        major:String(get("major")||"").trim(), jh:String(get("jh")||"").trim(),
        type:mapType(get("type"))||(kind==="정시"?"정시":"학종"),
        group:(function(){var g=norm(get("group")); return /^[가나다]$/.test(g)?g:"";})(),
        c6:(yn===null? kind==="수시" : yn),
        itv:parseDate(get("itv"),false), ann:parseDate(get("ann"),false), due:due,
        mreq:String(get("mreq")||"").trim(),
        mmet:(kind==="정시"?"해당없음":(mapMin(get("mmet"))||"미정")),
        status:st||"지원완료", rank:String(get("rank")||"").trim(),
        note:String(get("note")||"").trim()},
      statusRaw:String(get("status")||"").trim(), statusOk:!!st||!String(get("status")||"").trim()
    });
  }
  return {apps:out, skipped:skipped, notes:notes};
}

function commitApps(byStudent, cls){
  var added=0, updated=0, newStu=0;
  Object.keys(byStudent).forEach(function(key){
    var g=byStudent[key];
    var id=String(g.no||"").replace(/[^0-9A-Za-z_.~:@+-]/g,"");
    var st=id?students.get(id):null;
    if(!st){
      var hit=null;
      students.forEach(function(v){ if(!hit && g.name && v.name===g.name && v.cls===cls) hit=v; });
      st=hit;
    }
    if(!st){
      if(demo){ demo=false; document.getElementById("banner").hidden=true; students.clear(); }
      st={id:id||uid(), cls:cls, no:g.no||"", name:g.name||"", apps:[]};
      students.set(st.id, st); newStu++;
    }
    st.apps=st.apps||[];
    g.apps.forEach(function(a){
      var same=st.apps.filter(function(x){
        return x.univ===a.app.univ && (x.jh||"")===(a.app.jh||"") && x.kind===a.app.kind;
      })[0];
      if(same){
        ["major","type","group","itv","ann","due","status","rank","note"].forEach(function(k){
          if(a.app[k]) same[k]=a.app[k];
        });
        same.c6=a.app.c6; updated++;
      } else { st.apps.push(a.app); added++; }
    });
    applyMin(st); save(st);
  });
  pending=null;
  document.getElementById("preview").hidden=true;
  document.getElementById("file").value="";
  clearMsg();
  render();
  var host=document.getElementById("importMsg");
  var d=el("div","err"); d.style.borderLeftColor="var(--ok)"; d.style.background="var(--ok-soft)";
  d.appendChild(el("b",null,"넣었습니다"));
  d.appendChild(el("div","how","새 지원 "+added+"건, 갱신 "+updated+"건"+(newStu?", 새 학생 "+newStu+"명":"")+"."));
  host.appendChild(d);
}

function handleFile(f){
  var cls=getCls();
  if(!cls){ showError("반을 먼저 선택해 주세요.",""); return; }
  clearMsg();
  var name=(f.name||"").toLowerCase();
  var ext=name.slice(name.lastIndexOf(".")+1);

  if(ext==="hwp"){
    showError("구형 한글 파일(.hwp)은 이 화면에서 열 수 없습니다.",
      "한글에서 파일을 연 뒤 [파일 → 다른 이름으로 저장]에서 한/글 문서(.hwpx)를 골라 저장하고 그 파일을 넣어 주세요. 표를 그대로 복사해 붙여넣기 탭에 붙여도 됩니다.");
    return;
  }
  var reader=new FileReader();
  reader.onerror=function(){ showError("파일을 읽지 못했습니다.","다른 파일로 다시 시도해 주세요."); };

  if(ext==="hwpx"){
    if(typeof JSZip==="undefined"){
      showError("한글 파일을 여는 도구를 불러오지 못했습니다.","네트워크 상태를 확인하고 새로고침해 주세요. 급하면 붙여넣기 탭을 쓰시면 됩니다.");
      return;
    }
    reader.onload=function(){
      JSZip.loadAsync(reader.result).then(rowsFromHwpx).then(function(rows){
        route(rows, cls, "한글 "+f.name);
      }).catch(function(){
        showError("한글 파일 안에서 표를 찾지 못했습니다.","학번과 이름이 든 표가 있는 문서인지 확인해 주세요. 표를 복사해 붙여넣기 탭에 붙이면 확실합니다.");
      });
    };
    reader.readAsArrayBuffer(f);
    return;
  }
  if(ext==="xlsx"||ext==="xls"||ext==="xlsm"){
    if(typeof XLSX==="undefined"){
      showError("엑셀 파일을 여는 도구를 불러오지 못했습니다.","네트워크 상태를 확인하고 새로고침해 주세요. 엑셀에서 CSV로 저장해 넣으셔도 됩니다.");
      return;
    }
    reader.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(reader.result),{type:"array",cellDates:true});
        var rows=[];
        wb.SheetNames.forEach(function(sn){
          XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:""})
            .forEach(function(r){ rows.push(r); });
        });
        route(rows, cls, "엑셀 "+f.name);
      }catch(e){
        showError("엑셀 파일을 읽지 못했습니다.","파일이 손상되지 않았는지 확인하거나 CSV로 저장해 넣어 주세요.");
      }
    };
    reader.readAsArrayBuffer(f);
    return;
  }
  reader.onload=function(){
    var text=decodeText(reader.result);
    route(parseDelimited(text), cls, f.name);
  };
  reader.readAsArrayBuffer(f);
}

          updatedAt:body.updatedAt});
      });
      students=next;
      if(students.size>0){ demo=false; document.getElementById("banner").hidden=true; }
      setSync("live", snap.metadata.fromCache?"동기화 중":"저장됨");
      render();
    }, function(e){
      setSync("off", e&&e.code==="revoked"?"접근이 끝났습니다":"연결이 끊어졌습니다");
    });
  }).catch(function(){ setSync("off","이 화면에서는 저장되지 않습니다"); });
}
